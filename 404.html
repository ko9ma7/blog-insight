<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1014"><meta name="robots" content="noindex"><title>페이지를 찾을 수 없습니다 · 블로그 인사이트</title><link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><style>body{font:16px/1.7 system-ui,sans-serif;background:#0e1014;color:#f1f4f9;display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;box-sizing:border-box}main{max-width:470px;background:#171a20;border:1px solid #343943;border-radius:18px;padding:36px;text-align:center}h1{margin:0 0 14px}p{color:#aeb5c1}a,button{display:inline-block;color:#fff;background:#2f6bce;border:0;border-radius:8px;padding:10px 20px;font:inherit;text-decoration:none;cursor:pointer}button{background:#292f3a;margin-left:8px}a:focus-visible,button:focus-visible{outline:3px solid #81b5ff;outline-offset:3px}</style></head><body><main><h1>404 · 페이지를 찾을 수 없습니다</h1><p>주소가 변경되었거나 없는 페이지입니다. 메인 화면으로 돌아가 주세요.</p><a id="home" href="./index.html">홈으로 이동</a><button type="button" onclick="history.back()">이전 페이지</button></main><script>const p=location.pathname.split('/').filter(Boolean);if(location.hostname.endsWith('.github.io')&&p.length){const repo=p[0];document.querySelector('#home').href='/'+repo+'/';}</script></body></html>
